name: Risk Database Manager

on:
  repository_dispatch:
    types: [submit-form]

jobs:
  update-json:
    runs-on: ubuntu-latest
    # إضافة صلاحيات الكتابة بشكل صريح
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # استخدام توكن النظام الداخلي

      - name: Update RISKDBASE.JSON
        run: |
          # إنشاء الملف إذا لم يكن موجوداً
          if [ ! -f RISKDBASE.JSON ]; then
            echo "[]" > RISKDBASE.JSON
          fi

          # إضافة البيانات الجديدة
          NEW_RECORD='${{ toJson(github.event.client_payload) }}'
          jq ". += [$NEW_RECORD]" RISKDBASE.JSON > tmp.json && mv tmp.json RISKDBASE.JSON

      - name: Commit and Push
        run: |
          git config --global user.name "RiskBot"
          git config --global user.email "actions@github.com"
          git add RISKDBASE.JSON
          git commit -m "إضافة سجل خطر جديد رقم (${{ github.run_number }})"
          git push
